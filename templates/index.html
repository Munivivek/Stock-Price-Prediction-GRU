<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Price Prediction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Poppins', sans-serif;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .btn-primary {
            width: 100%;
            background-color: #3498db;
            border: none;
            padding: 10px;
            font-size: 16px;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        .prediction {
            text-align: center;
            font-size: 18px;
            color: #27ae60;
            font-weight: bold;
            margin-top: 20px;
        }
        .error {
            text-align: center;
            color: red;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .preview-img {
            display: block;
            max-width: 100%;
            margin: 20px auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stock Price Prediction</h1>
        <form method="POST" action="/predict" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label">Upload CSV with last 60 days of stock data:</label>
                <input type="file" name="file" class="form-control" accept=".csv" required>
            </div>
            <button type="submit" class="btn btn-primary">Predict Next Day Price</button>
        </form>

        {% if prediction %}
            <div class="prediction">{{ prediction }}</div>
        {% endif %}
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        {% if future_prediction_image %}
            <h3 class="text-center mt-4">Future Stock Price Prediction (Next 60 Days)</h3>
            <img src="{{ future_prediction_image }}" alt="Future Prediction" class="preview-img">
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
